<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>风水罗盘 · 指南针</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:10px;touch-action:none}
.box{background:#0f0f0f;border-radius:32px;padding:16px 14px 24px;box-shadow:0 20px 50px -10px #000,inset 0 0 0 1px #3a2f1a;max-width:660px;width:100%}
.title{text-align:center;color:#c9a86a;font-weight:400;letter-spacing:8px;font-size:.8rem;margin-bottom:6px}
.cv{position:relative;display:flex;justify-content:center;align-items:center;aspect-ratio:1/1;width:100%;max-width:520px;margin:0 auto}
canvas{width:100%!important;height:100%!important;display:block;border-radius:50%;filter:drop-shadow(0 16px 28px rgba(0,0,0,.9))}
.info{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.deg{font-size:2.6rem;font-weight:600;color:#f3e6d0;text-shadow:0 3px 10px #00000080;font-variant-numeric:tabular-nums;line-height:1}
.dir{font-size:1.15rem;letter-spacing:3px;color:#e6c27a;background:rgba(0,0,0,.5);padding:4px 20px;border-radius:30px;border:1px solid #c9a86a50;margin-top:4px}
.el{font-size:.8rem;letter-spacing:3px;color:#a89e8a;margin-top:4px}
.st{text-align:center;color:#7a7f8b;font-size:.7rem;margin-top:8px;height:14px}
.btn{margin-top:12px;background:#2a2318;border:1px solid #c9a86a60;border-radius:60px;color:#e6dbc9;font-size:.85rem;padding:11px 26px;font-weight:500;letter-spacing:.5px;box-shadow:0 8px 16px -6px #000;transition:all .15s;cursor:pointer}
.btn:hover{background:#3a3020;color:#fff}
.btn:active{transform:scale(.97)}
.fc{display:flex;justify-content:center}
.hd{display:none!important}
</style>
</head>
<body>
<div class="box">
<div class="title">· 风 水 罗 盘 ·</div>
<div class="cv"><canvas id="cv" width="800" height="800"></canvas></div>
<div class="info">
<div class="deg" id="deg">0°</div>
<div class="dir" id="dir">子 · 北</div>
<div class="el" id="el">水 · 玄武</div>
</div>
<div class="st" id="st">正在等待传感器数据…</div>
<div class="fc"><button class="btn" id="btn">🧭 点击启用指南针</button></div>
</div>

<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var degEl=document.getElementById('deg'),dirEl=document.getElementById('dir'),
    elEl=document.getElementById('el'),stEl=document.getElementById('st'),btn=document.getElementById('btn');
var heading=0,fHeading=0,active=false,listening=false,last=0,F=0.18;

// 数据
var SHAN=['子','癸','丑','艮','寅','甲','卯','乙','辰','巽','巳','丙','午','丁','未','坤','申','庚','酉','辛','戌','乾','亥','壬'];
var GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var GUA=['☰','☱','☲','☳','☴','☵','☶','☷']; // 八卦
var XING=['角','亢','氐','房','心','尾','箕','斗','牛','女','虚','危','室','壁','奎','娄','胃','昴','毕','觜','参','井','鬼','柳','星','张','翼','轸']; // 二十八宿

function getDir(d){d=((d%360)+360)%360;
if(d>=337.5||d<22.5)return'子 · 北';if(d<67.5)return'艮 · 东北';if(d<112.5)return'卯 · 东';if(d<157.5)return'巽 · 东南';
if(d<202.5)return'午 · 南';if(d<247.5)return'坤 · 西南';if(d<292.5)return'酉 · 西';return'乾 · 西北';}
function getEl(d){d=((d%360)+360)%360;
if(d>=337.5||d<22.5)return'水 · 玄武';if(d<67.5)return'土 · 螣蛇';if(d<112.5)return'木 · 青龙';if(d<157.5)return'木 · 青龙';
if(d<202.5)return'火 · 朱雀';if(d<247.5)return'土 · 勾陈';if(d<292.5)return'金 · 白虎';return'金 · 白虎';}

// 画环文字
function ringText(cx,cy,r,texts,font,color,startAng,radial){
    ctx.save();ctx.translate(cx,cy);
    ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=color;ctx.shadowColor='#000';ctx.shadowBlur=4;
    var n=texts.length,step=360/n;
    for(var i=0;i<n;i++){
        var a=((startAng+i*step)*Math.PI)/180;
        ctx.save();
        ctx.rotate(a);
        if(radial)ctx.rotate(Math.PI/2);
        ctx.translate(0,-r);
        ctx.fillText(texts[i],0,0);
        ctx.restore();
    }
    ctx.restore();
}

// 画太极
function drawTaiji(cx,cy,r){
    ctx.save();ctx.translate(cx,cy);
    ctx.beginPath();ctx.arc(0,0,r,-Math.PI/2,Math.PI/2);ctx.fillStyle='#f5ecd8';ctx.fill();
    ctx.beginPath();ctx.arc(0,0,r,Math.PI/2,-Math.PI/2);ctx.fillStyle='#1a1a1a';ctx.fill();
    ctx.beginPath();ctx.arc(0,-r/2,r/2,0,Math.PI*2);ctx.fillStyle='#1a1a1a';ctx.fill();
    ctx.beginPath();ctx.arc(0,r/2,r/2,0,Math.PI*2);ctx.fillStyle='#f5ecd8';ctx.fill();
    ctx.beginPath();ctx.arc(0,-r/2,r/6,0,Math.PI*2);ctx.fillStyle='#f5ecd8';ctx.fill();
    ctx.beginPath();ctx.arc(0,r/2,r/6,0,Math.PI*2);ctx.fillStyle='#1a1a1a';ctx.fill();
    ctx.restore();
}

function draw(h){
    var w=cv.width,h2=cv.height,cx=w/2,cy=h2/2;
    var R=Math.min(w,h2)*0.44;
    ctx.clearRect(0,0,w,h2);

    // 外圈深色底
    ctx.beginPath();ctx.arc(cx,cy,R*1.02,0,Math.PI*2);
    ctx.fillStyle='#1a150a';ctx.fill();

    // 主罗盘黄底
    var bg=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R*1.02);
    bg.addColorStop(0,'#f5e8c8');bg.addColorStop(.7,'#e8d5a0');bg.addColorStop(1,'#c9a86a');
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
    ctx.strokeStyle='#8b6f3a';ctx.lineWidth=3;ctx.stroke();

    // 外框红黑线
    ctx.beginPath();ctx.arc(cx,cy,R*.98,0,Math.PI*2);ctx.strokeStyle='#8b1a1a';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,R*.95,0,Math.PI*2);ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;ctx.stroke();

    // 1. 最外圈：六十四卦（小符号）
    var gua64=['䷀','䷁','䷂','䷃','䷄','䷅','䷆','䷇','䷈','䷉','䷊','䷋','䷌','䷍','䷎','䷏','䷐','䷑','䷒','䷓','䷔','䷕','䷖','䷗','䷘','䷙','䷚','䷛','䷜','䷝','䷞','䷟','䷠','䷡','䷢','䷣','䷤','䷥','䷦','䷧','䷨','䷩','䷪','䷫','䷬','䷭','䷮','䷯','䷰','䷱','䷲','䷳','䷴','䷵','䷶','䷷','䷸','䷹','䷺','䷻','䷼','䷽','䷾','䷿'];
    ringText(cx,cy,R*.925,gua64,R*.022+'px sans-serif','#3a2a10',0,false);

    // 2. 二十八宿
    ringText(cx,cy,R*.875,XING,R*.024+'px "PingFang SC","Microsoft YaHei",sans-serif','#4a3520',0,false);

    // 3. 二十四山（红字）
    ringText(cx,cy,R*.815,SHAN,'bold '+R*.032+'px "PingFang SC","Microsoft YaHei",sans-serif','#8b1a1a',0,false);

    // 4. 天干地支
    var gz=GAN.concat(ZHI);
    ringText(cx,cy,R*.755,gz,R*.026+'px "PingFang SC","Microsoft YaHei",sans-serif','#1a1a1a',0,false);

    // 5. 八卦符号（大）
    ringText(cx,cy,R*.68,GUA,R*.055+'px "Segoe UI Symbol",sans-serif','#1a1a1a',0,false);

    // 6. 内圈刻度
    ctx.save();ctx.translate(cx,cy);
    for(var i=0;i<360;i+=5){
        var rad=i*Math.PI/180;
        var isMajor=i%30===0, isCard=i%90===0;
        var outR=R*.62, inR=isMajor?(isCard?R*.55:R*.57):R*.59;
        ctx.beginPath();
        ctx.moveTo(Math.sin(rad)*outR,-Math.cos(rad)*outR);
        ctx.lineTo(Math.sin(rad)*inR,-Math.cos(rad)*inR);
        ctx.strokeStyle=isCard?'#8b1a1a':(isMajor?'#1a1a1a':'#5a4a30');
        ctx.lineWidth=isCard?2.5:(isMajor?1.8:1);
        ctx.stroke();
    }
    ctx.restore();

    // 中心区（白底）
    ctx.beginPath();ctx.arc(cx,cy,R*.50,0,Math.PI*2);
    ctx.fillStyle='#f5ecd8';ctx.fill();
    ctx.strokeStyle='#8b6f3a';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,R*.48,0,Math.PI*2);
    ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;ctx.stroke();

    // 内圈小字（十二地支，红黑交替）
    var zhi12=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    ringText(cx,cy,R*.44,zhi12,'bold '+R*.045+'px "PingFang SC","Microsoft YaHei",sans-serif','#8b1a1a',0,false);

    // 最中心太极
    drawTaiji(cx,cy,R*.32);

    // 中心十字红线
    ctx.save();ctx.translate(cx,cy);
    ctx.beginPath();ctx.moveTo(-R*.32,0);ctx.lineTo(R*.32,0);
    ctx.moveTo(0,-R*.32);ctx.lineTo(0,R*.32);
    ctx.strokeStyle='#8b1a1a';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();

    // 指针（磁针）：红北白南，指向 -heading 方向
    ctx.save();ctx.translate(cx,cy);
    ctx.rotate((-h*Math.PI)/180);
    var pl=R*.40,pw=R*.035;
    // 红端（北）
    ctx.beginPath();
    ctx.moveTo(0,-pl);ctx.lineTo(pw*3,0);ctx.lineTo(0,pw);ctx.lineTo(-pw*3,0);ctx.closePath();
    ctx.fillStyle='#c81e1e';ctx.shadowColor='#ff000080';ctx.shadowBlur=10;ctx.fill();
    // 白端（南）
    ctx.beginPath();
    ctx.moveTo(0,pl);ctx.lineTo(pw*3,0);ctx.lineTo(0,-pw);ctx.lineTo(-pw*3,0);ctx.closePath();
    ctx.fillStyle='#f5f5f5';ctx.shadowColor='#ffffff60';ctx.shadowBlur=8;ctx.fill();
    // 中心轴
    ctx.beginPath();ctx.arc(0,0,R*.022,0,Math.PI*2);
    ctx.fillStyle='#c9a86a';ctx.shadowBlur=8;ctx.fill();
    ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();

    // 红色十字线（贯穿罗盘，装饰）
    ctx.save();ctx.translate(cx,cy);
    ctx.beginPath();
    ctx.moveTo(-R*.98,0);ctx.lineTo(-R*.52,0);
    ctx.moveTo(R*.52,0);ctx.lineTo(R*.98,0);
    ctx.moveTo(0,-R*.98);ctx.lineTo(0,-R*.52);
    ctx.moveTo(0,R*.52);ctx.lineTo(0,R*.98);
    ctx.strokeStyle='#8b1a1a70';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
}

function update(d){
    var n=((d%360)+360)%360;
    degEl.textContent=Math.round(n)+'°';
    dirEl.textContent=getDir(n);
    elEl.textContent=getEl(n);
    draw(n);
}

function onOri(e){
    var hh=null;
    if(e.webkitCompassHeading!==undefined&&e.webkitCompassHeading!==null){hh=e.webkitCompassHeading;}
    else if(e.alpha!==undefined&&e.alpha!==null){hh=(360-e.alpha)%360;}
    if(hh===null||isNaN(hh)){stEl.textContent='⚠️ 无法读取方向数据';return;}
    if(!active){fHeading=hh;active=true;stEl.textContent='✅ 罗盘已激活';}
    else{var diff=hh-fHeading;if(diff>180)diff-=360;if(diff<-180)diff+=360;fHeading=(fHeading+F*diff+360)%360;}
    update(fHeading);last=Date.now();
}

function start(){
    if(listening)return;
    if(window.DeviceOrientationEvent){
        window.addEventListener('deviceorientation',onOri,true);
        listening=true;stEl.textContent='📡 正在接收方向数据…';
    }else{
        stEl.textContent='❌ 浏览器不支持方向传感器';
        btn.classList.add('hd');update(0);return;
    }
    setTimeout(function(){if(last===0)stEl.textContent='⏳ 等待传感器数据…';},3000);
}

function ask(){
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
        DeviceOrientationEvent.requestPermission().then(function(s){
            if(s==='granted'){start();btn.classList.add('hd');}
            else{stEl.textContent='❌ 权限被拒绝';btn.textContent='重新请求权限';}
        }).catch(function(){stEl.textContent='⚠️ 请求权限失败';});
    }else{start();btn.classList.add('hd');}
}

function init(){
    draw(0);degEl.textContent='0°';dirEl.textContent='子 · 北';elEl.textContent='水 · 玄武';
    stEl.textContent='点击按钮启用方向传感器';
    if(!window.DeviceOrientationEvent){
        stEl.textContent='⚠️ 当前环境不支持方向传感器';
        btn.textContent='不支持传感器';btn.disabled=true;btn.style.opacity='.6';
    }else{btn.addEventListener('click',ask);}
}
window.addEventListener('load',init);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&listening)update(fHeading);});
})();
</script>
</body>
</html>
