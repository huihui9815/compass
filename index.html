<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风水罗盘 · 简易八卦二十四山</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1e1a17;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', serif;
            padding: 20px;
        }

        .container {
            background: #2c241e;
            padding: 20px 20px 30px;
            border-radius: 50px 50px 30px 30px;
            box-shadow: 
                0 20px 30px rgba(0, 0, 0, 0.8),
                inset 0 0 10px #5e4b3c;
            border: 1px solid #b89b7b;
        }

        canvas {
            display: block;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            box-shadow: 
                0 0 0 6px #3e2e20,
                0 0 0 10px #9c7e5e,
                0 0 30px 10px #00000080;
            background: #f7f1e0; /* 宣纸底色 */
            cursor: pointer;
            transition: filter 0.2s;
        }

        canvas:active {
            filter: brightness(1.1);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            color: #d9c8a9;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .controls button {
            background: #4d3827;
            border: none;
            color: #f0e2ce;
            font-size: 1rem;
            padding: 8px 24px;
            border-radius: 30px;
            font-family: inherit;
            font-weight: 600;
            box-shadow: 0 4px 0 #1f140e, 0 6px 10px black;
            cursor: pointer;
            transition: all 0.06s linear;
            letter-spacing: 1px;
        }

        .controls button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1f140e, 0 4px 8px black;
        }

        .angle-display {
            font-size: 1.3rem;
            background: #1e1612;
            padding: 6px 24px;
            border-radius: 40px;
            border: 1px solid #a2805a;
            box-shadow: inset 0 0 6px #2b1f17;
            color: #eedbba;
            font-variant-numeric: tabular-nums;
            min-width: 120px;
            text-align: center;
        }

        .hint {
            margin-top: 16px;
            color: #b8a690;
            font-size: 0.85rem;
            text-align: center;
            letter-spacing: 1px;
            font-style: italic;
        }
    </style>
</head>
<body>
<div class="container">
    <canvas id="luopanCanvas" width="600" height="600"></canvas>
    <div class="controls">
        <button id="resetBtn">归正</button>
        <div class="angle-display" id="angleDisplay">0°</div>
        <button id="rotateBtn">旋转</button>
    </div>
    <div class="hint">点击罗盘面 / 拖动指针 · 轻触旋转</div>
</div>
<script>
    (function() {
        const canvas = document.getElementById('luopanCanvas');
        const ctx = canvas.getContext('2d');
        const angleDisplay = document.getElementById('angleDisplay');

        // 罗盘当前旋转角度 (0° 表示指针在正北/子山，罗盘本身不转，指针转)
        // 我们用视觉表现：指针从圆心指向外，表示当前“朝向”.
        // 为了符合风水习惯，0° = 正北(子)，顺时针增加.
        let currentAngle = 0;          // 单位: 度  0°=子北, 顺时针增大
        let isDragging = false;
        let lastMouseAngle = 0;

        // 常量
        const CENTER_X = 300;
        const CENTER_Y = 300;
        const OUTER_RADIUS = 280;      // 最外圈
        const INNER_RADIUS = 40;       // 中心小圆

        // 八卦名称与符号 (后天八卦方位)
        const BAGUA = [
            { name: '坎', symbol: '☵', dir: '北', angle: 0 },      // 坎为水，正北
            { name: '艮', symbol: '☶', dir: '东北', angle: 45 },
            { name: '震', symbol: '☳', dir: '东', angle: 90 },
            { name: '巽', symbol: '☴', dir: '东南', angle: 135 },
            { name: '离', symbol: '☲', dir: '南', angle: 180 },
            { name: '坤', symbol: '☷', dir: '西南', angle: 225 },
            { name: '兑', symbol: '☱', dir: '西', angle: 270 },
            { name: '乾', symbol: '☰', dir: '西北', angle: 315 }
        ];

        // 二十四山 (从正北子山开始，顺时针，每15度一山)
        const MOUNTAINS_24 = [
            '子', '癸', '丑', '艮', '寅', '甲', '卯', '乙', '辰', '巽', '巳', '丙',
            '午', '丁', '未', '坤', '申', '庚', '酉', '辛', '戌', '乾', '亥', '壬'
        ];

        // 画背景底色 (宣纸纹理感通过轻微渐变模拟)
        function drawBackground() {
            // 径向渐变模拟宣纸中心亮边缘暗
            const grad = ctx.createRadialGradient(280, 280, 100, 320, 320, 500);
            grad.addColorStop(0, '#faf3e4');
            grad.addColorStop(0.8, '#e8dbc4');
            grad.addColorStop(1, '#cfbfa4');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, OUTER_RADIUS + 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // 绘制多层同心圆（代表天池、内盘、外盘）
        function drawRings() {
            // 最外圈粗边
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, OUTER_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = '#5a3e2b';
            ctx.lineWidth = 8;
            ctx.stroke();

            // 第二圈 (细)
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, OUTER_RADIUS - 8, 0, Math.PI * 2);
            ctx.strokeStyle = '#8b6f50';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 八卦外圈参考线 (半径255)
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, 250, 0, Math.PI * 2);
            ctx.strokeStyle = '#aa8b6a';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 二十四山分隔圈 (半径210)
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, 210, 0, Math.PI * 2);
            ctx.strokeStyle = '#b08e68';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 内圈 (半径140) 用于放八卦符号
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, 140, 0, Math.PI * 2);
            ctx.strokeStyle = '#b08e68';
            ctx.lineWidth = 1.8;
            ctx.stroke();

            // 天池小圆 (半径65)
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, 65, 0, Math.PI * 2);
            ctx.strokeStyle = '#6a4e34';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // 中心太极区域参考小圆 (半径40)
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, 40, 0, Math.PI * 2);
            ctx.strokeStyle = '#8b6f50';
            ctx.lineWidth = 1.2;
            ctx.stroke();
        }

        // 绘制二十四山文字 (沿圆周排列，每15度一个，文字径向朝外)
        function draw24Mountains() {
            const radiusText = 178; // 文字半径 (位于210环内侧一点)
            ctx.font = 'bold 18px "Noto Serif SC", "KaiTi", "楷体", "Microsoft YaHei", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#2e241b';

            // 让文字方向径向朝外：旋转坐标系使文字底部指向圆心 (或者可以径向朝外)
            // 但通常罗盘的字是底部指向圆心或顶部指向圆心？为了易读，让字头朝外（即字底朝圆心），
            // 这样从外面读是正的，但需要每个字旋转角度+90°? 更清晰的方式：让文字沿切线方向？ 
            // 传统风水罗盘二十四山文字是径向排列，字头朝向圆心或朝外。这里为了美观且可读，
            // 采用字头朝外，即每个字旋转 (angle-90) 度? 若角度0°在正北，我们希望“子”字是竖直的。
            // 通常正北的字底部朝圆心？不，为了从上方看字正，应该在正北处字顶部朝上（即不旋转）。
            // 如果按角度旋转，会倾斜。干脆都保持正立？但那样不传统。 
            // 改用传统方式：文字方向径向朝外，即旋转角度 = 角度(弧度) - 90°? 测试。
            // 简单实现：所有文字不旋转，每个字都水平——这样虽然不传统但绝对清晰易读。
            // 但风水罗盘通常是字头朝向圆心（便于从外圈读）。权衡后，为了让用户容易辨认，采用水平文字，
            // 但紧密排列，可能会重叠？24个字每个15度，半径178，弧长 ≈ 178*0.2618≈46.6px，足够。
            // 而水平放置不会重叠。好看且易读。
            // 我决定：全部水平绘制！更符合现代UI，不丢失信息。
            
            for (let i = 0; i < 24; i++) {
                // 角度：从正北(0°)开始，顺时针
                const angleDeg = i * 15; 
                const angleRad = (angleDeg - 90) * Math.PI / 180; // 转换为canvas坐标(0°在三点钟方向，我们调整-90°使0°在正上方)
                // 注意：风水罗盘正北是0°，顺时针，canvas的0°在三点钟，所以-90°使0°指向正上方（北）
                const x = CENTER_X + radiusText * Math.cos(angleRad);
                const y = CENTER_Y + radiusText * Math.sin(angleRad);
                
                // 文字颜色微调：四维八干十二支可略不同？保持统一深褐色
                ctx.fillStyle = '#3d2e20';
                // 如果是四维(乾坤艮巽)用深红
                const mountain = MOUNTAINS_24[i];
                if (mountain === '乾' || mountain === '坤' || mountain === '艮' || mountain === '巽') {
                    ctx.fillStyle = '#8b3a3a'; // 暗红
                } else if ('子午卯酉'.includes(mountain)) {
                    ctx.fillStyle = '#2c4a2c'; // 墨绿
                }
                
                ctx.font = 'bold 20px "Noto Serif SC", "KaiTi", "楷体", "Microsoft YaHei", serif';
                ctx.fillText(mountain, x, y);
            }
        }

        // 绘制八卦符号以及卦名(小字) —— 位于内圈
        function drawBagua() {
            const radiusSymbol = 88;    // 符号半径
            const radiusName = 125;     // 卦名半径

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            BAGUA.forEach((gua, index) => {
                // 角度: 后天八卦方位，坎北0°，艮东北45°...
                const angleDeg = gua.angle;
                const angleRad = (angleDeg - 90) * Math.PI / 180; // 转换为canvas

                // 绘制卦象符号 (大号)
                const sx = CENTER_X + radiusSymbol * Math.cos(angleRad);
                const sy = CENTER_Y + radiusSymbol * Math.sin(angleRad);
                ctx.font = '34px "Segoe UI Symbol", "Noto Sans Symbols", "Arial Unicode MS", sans-serif';
                ctx.fillStyle = '#1f1a15';
                ctx.fillText(gua.symbol, sx, sy);

                // 绘制卦名 (小字)
                const nx = CENTER_X + radiusName * Math.cos(angleRad);
                const ny = CENTER_Y + radiusName * Math.sin(angleRad);
                ctx.font = 'bold 16px "Noto Serif SC", "KaiTi", "楷体", serif';
                ctx.fillStyle = '#6b4f33';
                ctx.fillText(gua.name, nx, ny);
            });
        }

        // 绘制中心太极图（简化版，阴阳鱼）
        function drawTaiji() {
            const taijiRadius = 38;
            ctx.save();
            ctx.translate(CENTER_X, CENTER_Y);
            
            // 白底圆
            ctx.beginPath();
            ctx.arc(0, 0, taijiRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#f5ede1';
            ctx.fill();
            ctx.strokeStyle = '#5f4a34';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 黑色半圆 (阴鱼)
            ctx.beginPath();
            ctx.arc(0, 0, taijiRadius, -Math.PI / 2, Math.PI / 2, false);
            ctx.fillStyle = '#1e1a17';
            ctx.fill();

            // 画两个小圆 (鱼眼)
            // 上半部小圆(阴鱼眼，白色)
            ctx.beginPath();
            ctx.arc(0, -taijiRadius / 2, taijiRadius / 6, 0, Math.PI * 2);
            ctx.fillStyle = '#f5ede1';
            ctx.fill();
            // 下半部小圆(阳鱼眼，黑色)
            ctx.beginPath();
            ctx.arc(0, taijiRadius / 2, taijiRadius / 6, 0, Math.PI * 2);
            ctx.fillStyle = '#1e1a17';
            ctx.fill();

            // 外圈装饰
            ctx.beginPath();
            ctx.arc(0, 0, taijiRadius + 4, 0, Math.PI * 2);
            ctx.strokeStyle = '#b99f82';
            ctx.lineWidth = 1.8;
            ctx.stroke();

            ctx.restore();
        }

        // 绘制指针 (磁针/天池指针) 根据 currentAngle 旋转
        function drawNeedle() {
            const needleLength = 200;   // 指针长度 (从中心向外)
            const needleWidth = 10;     // 指针宽度 (中心处)
            
            ctx.save();
            ctx.translate(CENTER_X, CENTER_Y);
            // 指针角度：0°指向正北(上方)，因此从-90°开始旋转 currentAngle
            // canvas坐标：0°指向右侧，所以我们让指针初始指向正上方为0°
            // 但我们的 currentAngle 是0°=北，所以旋转 currentAngle 度即可 (因为-90°+ currentAngle)
            const rad = (currentAngle - 90) * Math.PI / 180; // 使0°指向正上
            
            ctx.rotate(rad + Math.PI / 2); // 微调: 需要指针从中心指向北，我们旋转使得指针顶部方向为北
            // 实际上我们把坐标系旋转到指针方向。先让指针默认指向正右(0°)，然后旋转。
            // 我们希望指针方向 = currentAngle(北偏东顺时针)。 canvas 中0°是正右，我们要转换。
            // 更简单: 旋转 (currentAngle - 90) 度？ 试一下。
            // 重写：使用绝对坐标画指针，不旋转坐标系，直接计算终点。这样更容易控制。
            ctx.restore(); // 恢复，改用数学计算

            // 改用纯数学计算指针终点，不再旋转坐标系
            const radPointer = (currentAngle - 90) * Math.PI / 180; // 0°→-90° 指向正北
            const startX = CENTER_X;
            const startY = CENTER_Y;
            const endX = CENTER_X + needleLength * Math.cos(radPointer);
            const endY = CENTER_Y + needleLength * Math.sin(radPointer);
            
            // 指针尾部（反向小段，表示磁针南极? 风水指针通常一头指向南，我们简化为一根指向当前方位的针）
            // 但为了美观，画一个菱形指针：从中心到外。
            // 绘制指针主体 (带渐变)
            ctx.beginPath();
            // 计算垂直方向偏移向量 (用于画菱形)
            const perpRad = radPointer + Math.PI / 2;
            const perpX = Math.cos(perpRad) * 5;
            const perpY = Math.sin(perpRad) * 5;
            
            // 菱形四个点: 中心两侧偏移，终点一个尖
            ctx.moveTo(CENTER_X + perpX, CENTER_Y + perpY); // 下侧偏移
            ctx.lineTo(endX, endY); // 指针尖
            ctx.lineTo(CENTER_X - perpX, CENTER_Y - perpY); // 上侧偏移
            ctx.closePath();
            
            // 红色指针 (传统磁针红色指南)
            ctx.fillStyle = '#c43b2b';
            ctx.shadowColor = '#6b1e1e';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowColor = 'transparent'; // 重置阴影
            
            // 指针中心圆点装饰
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#b8863d';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#4a2e18';
            ctx.fill();
            ctx.shadowColor = 'transparent';
            
            // 指针尖上加一个小圆点
            ctx.beginPath();
            ctx.arc(endX, endY, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#f5d742';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#c99a2e';
            ctx.fill();
            ctx.shadowColor = 'transparent';

            // 再画一根短的反向针(黑色,表示南)
            const backEndX = CENTER_X - 70 * Math.cos(radPointer);
            const backEndY = CENTER_Y - 70 * Math.sin(radPointer);
            ctx.beginPath();
            ctx.moveTo(CENTER_X + perpX * 0.7, CENTER_Y + perpY * 0.7);
            ctx.lineTo(backEndX, backEndY);
            ctx.lineTo(CENTER_X - perpX * 0.7, CENTER_Y - perpY * 0.7);
            ctx.closePath();
            ctx.fillStyle = '#2f2a24';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#1a1310';
            ctx.fill();
            ctx.shadowColor = 'transparent';
        }

        // 绘制外圈刻度线 (每15度一根短线，代表二十四山分界)
        function drawTickMarks() {
            const outerTickRadius = 245;   // 刻度外半径
            const innerTickRadius = 225;   // 刻度内半径
            
            ctx.save();
            ctx.strokeStyle = '#876e52';
            ctx.lineWidth = 1.8;
            
            for (let i = 0; i < 24; i++) {
                const angleDeg = i * 15;
                const angleRad = (angleDeg - 90) * Math.PI / 180;
                
                const x1 = CENTER_X + innerTickRadius * Math.cos(angleRad);
                const y1 = CENTER_Y + innerTickRadius * Math.sin(angleRad);
                const x2 = CENTER_X + outerTickRadius * Math.cos(angleRad);
                const y2 = CENTER_Y + outerTickRadius * Math.sin(angleRad);
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            ctx.restore();
        }

        // 绘制所有内容
        function drawLuopan() {
            ctx.clearRect(0, 0, 600, 600);
            
            // 背景底色
            drawBackground();
            
            // 同心圆
            drawRings();
            
            // 刻度线
            drawTickMarks();
            
            // 二十四山文字
            draw24Mountains();
            
            // 八卦符号 + 卦名
            drawBagua();
            
            // 太极图
            drawTaiji();
            
            // 指针 (根据currentAngle)
            drawNeedle();
            
            // 中心极小的装饰圈
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#b99a6b';
            ctx.fill();
        }

        // 更新角度显示
        function updateAngleDisplay() {
            const displayAngle = ((currentAngle % 360) + 360) % 360; // 0~359
            angleDisplay.textContent = Math.round(displayAngle) + '°';
        }

        // 设置角度并重绘
        function setAngle(deg) {
            currentAngle = deg;
            updateAngleDisplay();
            drawLuopan();
        }

        // 从鼠标/触摸位置计算角度 (0°=正北, 顺时针)
        function getAngleFromEvent(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;   // canvas物理像素比
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            // 相对于canvas CSS坐标
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            const dx = canvasX - CENTER_X;
            const dy = canvasY - CENTER_Y;
            
            // 计算角度: 从正北(0, -1) 顺时针
            let angleRad = Math.atan2(dy, dx);  // 返回 -PI 到 PI, 0指向右
            // 转换为以正北为0°, 顺时针
            let angleDeg = (angleRad * 180 / Math.PI + 90 + 360) % 360; // 加90因为atan2(0,-1)是-PI/2, 要转到正北
            // 实际上：期望当dx=0, dy=-1 (正北) 时，angleDeg=0。
            // 使用atan2(dy, dx) 返回 -PI/2 对于正北。 所以 (angleRad * 180/PI) 得到 -90。
            // 加上90 -> 0°, 完美。
            
            return angleDeg;
        }

        // 重置到正北
        function resetToNorth() {
            setAngle(0);
        }

        // 随机旋转
        function rotateRandom() {
            const randomDeg = Math.floor(Math.random() * 360);
            setAngle(randomDeg);
        }

        // 事件监听
        function initEvents() {
            // 鼠标拖动
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                const angle = getAngleFromEvent(e);
                lastMouseAngle = angle;
                setAngle(angle); // 点击即转到该角度，更直观
                e.preventDefault();
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const angle = getAngleFromEvent(e);
                // 为了平滑，直接设置角度跟随鼠标
                setAngle(angle);
                e.preventDefault();
            });

            canvas.addEventListener('mouseup', () => {
                isDragging = false;
            });

            canvas.addEventListener('mouseleave', () => {
                isDragging = false;
            });

            // 触摸事件
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const angle = getAngleFromEvent(e);
                lastMouseAngle = angle;
                setAngle(angle);
                isDragging = true;
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!isDragging) return;
                const angle = getAngleFromEvent(e);
                setAngle(angle);
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                isDragging = false;
            });

            canvas.addEventListener('touchcancel', (e) => {
                isDragging = false;
            });

            // 按钮
            document.getElementById('resetBtn').addEventListener('click', resetToNorth);
            document.getElementById('rotateBtn').addEventListener('click', rotateRandom);
        }

        // 初始化
        function init() {
            drawLuopan();
            updateAngleDisplay();
            initEvents();
        }

        init();
    })();
</script>
</body>
</html>
