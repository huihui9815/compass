<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>风水罗盘 · 指南针</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;width:100%;overflow:hidden;background:#0a0a0a}
body{
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  touch-action:none;
}
#wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.title{text-align:center;color:#c9a86a;font-weight:500;letter-spacing:10px;font-size:.8rem;margin-bottom:2px;opacity:.9}
#cvWrap{position:relative;display:block;margin:0 auto}
canvas{display:block;border-radius:50%;filter:drop-shadow(0 10px 22px rgba(0,0,0,.85))}
.info{display:flex;flex-direction:column;align-items:center;margin-top:1px}
.deg{font-size:1.9rem;font-weight:700;color:#f7ead0;text-shadow:0 4px 14px #000000a0;font-variant-numeric:tabular-nums;line-height:1}
.dir{font-size:.95rem;letter-spacing:3px;color:#f0cc7a;background:rgba(0,0,0,.6);padding:2px 16px;border-radius:30px;border:1px solid #c9a86a80;margin-top:2px}
.el{font-size:.7rem;letter-spacing:1px;color:#c8bea8;margin-top:1px;text-align:center;line-height:1.3}

.guaTag{
  margin-top:5px;
  padding:5px 16px;
  border-radius:30px;
  background:linear-gradient(180deg,rgba(201,168,106,.16),rgba(201,168,106,.05));
  border:1px solid rgba(201,168,106,.45);
  color:#f0d78c;
  font-size:.8rem;
  font-weight:600;
  letter-spacing:1px;
  cursor:pointer;
  text-align:center;
  max-width:94vw;
  box-shadow:0 6px 16px -6px #000;
  transition:all .15s;
}
.guaTag:active{transform:scale(.97)}
.guaTag .sub{color:#a89e8a;font-size:.65rem;font-weight:400;letter-spacing:.5px;margin-left:6px}

.btnRow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.btn{background:#2a2318;border:1px solid #c9a86a90;border-radius:60px;color:#f5ecdc;font-size:.8rem;padding:8px 18px;font-weight:600;letter-spacing:.5px;box-shadow:0 10px 20px -6px #000;transition:all .15s;cursor:pointer}
.btn:active{transform:scale(.97)}
.hd{display:none!important}

/* 通用底部面板 */
.panelMask{
  position:fixed;left:0;right:0;top:0;bottom:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;
  transition:opacity .25s;
  z-index:100;
}
.panelMask.show{opacity:1;pointer-events:auto}
.panel{
  position:fixed;left:0;right:0;bottom:0;
  max-height:82vh;
  background:linear-gradient(180deg,#1a150a,#0d0a06);
  border-top:1px solid #c9a86a60;
  border-radius:22px 22px 0 0;
  box-shadow:0 -20px 40px -10px #000;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.2,.7,.3,1);
  z-index:101;
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.panel.show{transform:translateY(0)}
.panelHandle{
  width:40px;height:4px;background:#8a7a5a;border-radius:2px;
  margin:8px auto 4px;flex-shrink:0;
}
.panelHead{
  padding:4px 18px 8px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(201,168,106,.18);
  flex-shrink:0;
}
.panelTitle{color:#f0d78c;font-size:1.05rem;font-weight:700;letter-spacing:2px}
.panelClose{color:#a89e8a;font-size:1.2rem;background:transparent;border:none;cursor:pointer;padding:4px 8px;line-height:1}

/* 卦象面板内容 */
.panelBody{
  overflow-y:auto;
  padding:10px 18px 22px;
  color:#d8cbb0;
  font-size:.8rem;
  line-height:1.55;
  -webkit-overflow-scrolling:touch;
}
.section{margin-bottom:12px}
.sectionTitle{
  color:#c9a86a;font-size:.72rem;letter-spacing:3px;font-weight:600;
  margin-bottom:5px;padding-bottom:2px;
  border-bottom:1px dashed rgba(201,168,106,.25);
}
.guaHeader{text-align:center;padding:6px 0 10px;border-bottom:1px solid rgba(201,168,106,.2);margin-bottom:10px}
.guaHeaderName{font-size:1.4rem;font-weight:700;color:#f5e5a8;letter-spacing:4px;text-shadow:0 2px 10px #000}
.guaHeaderSymbol{font-size:1.8rem;color:#c9a86a;margin-left:8px;vertical-align:middle}
.guaHeaderMeta{font-size:.72rem;color:#a89e8a;letter-spacing:2px;margin-top:4px}
.ciphr{font-size:.85rem;color:#f0e2b8;font-weight:600;letter-spacing:.5px;line-height:1.6}
.expl{display:flex;flex-direction:column;gap:2px;margin-top:5px}
.explRow{display:flex;gap:8px;font-size:.78rem;line-height:1.45}
.explNo{color:#c9a86a;font-weight:600;flex-shrink:0;min-width:22px}
.explText{color:#c8bea8;flex:1}
.xiang{font-style:italic;color:#c8bea8;font-size:.8rem;padding:7px 12px;border-left:2px solid #c9a86a80;background:rgba(201,168,106,.05);border-radius:0 6px 6px 0;line-height:1.55}
.xiangBai{margin-top:5px;color:#a89e8a;font-size:.76rem;line-height:1.5;padding-left:12px;border-left:2px solid #5a4a3070}
.tuan{font-style:italic;color:#d8cbb0;font-size:.79rem;padding:7px 12px;border-left:2px solid #8b1a1a80;background:rgba(139,26,26,.06);border-radius:0 6px 6px 0;line-height:1.6}
.yaoRow{display:flex;gap:8px;font-size:.78rem;line-height:1.5;padding:4px 0;border-bottom:1px dotted rgba(201,168,106,.12)}
.yaoRow:last-child{border-bottom:none}
.yaoNo{color:#c9a86a;font-weight:600;flex-shrink:0;min-width:32px}
.yaoText{color:#e6dcc4;flex:1}
.tip{text-align:center;color:#8a7f68;font-size:.62rem;letter-spacing:1px;margin-top:8px}

/* 64 卦速查表（网格） */
.lookupIntro{
  color:#a89e8a;font-size:.72rem;text-align:center;letter-spacing:1px;
  padding:2px 0 10px;
}
.lookupGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}
.lookupItem{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px 2px;
  border-radius:8px;
  background:rgba(201,168,106,.06);
  border:1px solid rgba(201,168,106,.15);
}
.lookupItem .sym{
  font-size:1.15rem;color:#d8c08a;line-height:1;
}
.lookupItem .nm{
  font-size:.6rem;color:#a89e8a;margin-top:2px;
  text-align:center;line-height:1.15;
  white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
  max-width:100%;
}
.lookupItem .no{
  font-size:.52rem;color:#6a5f4a;margin-top:1px;
}
</style>
</head>
<body>
<div id="wrap">
  <div class="title">· 风 水 罗 盘 ·</div>
  <div id="cvWrap"><canvas id="cv"></canvas></div>
  <div class="info">
    <div class="deg" id="deg">0°</div>
    <div class="dir" id="dir">坎 · 北</div>
    <div class="el" id="el">子山 · 鼠 · 水（玄武）</div>
  </div>
  <div class="guaTag" id="guaTag">
    <span id="guaTagName">坎为水</span>
    <span class="sub" id="guaTagSub">· 水洊至</span>
  </div>
  <div class="btnRow">
    <button class="btn" id="btnStart">🧭 启用指南针</button>
    <button class="btn" id="btnLookup">📖 六十四卦</button>
  </div>
</div>

<!-- 卦象面板 -->
<div class="panelMask" id="panelMask"></div>
<div class="panel" id="panel">
  <div class="panelHandle"></div>
  <div class="panelHead">
    <div class="panelTitle" id="panelTitle">坎为水</div>
    <button class="panelClose" id="panelClose">✕</button>
  </div>
  <div class="panelBody" id="panelBody"></div>
</div>

<!-- 64卦速查面板 -->
<div class="panelMask" id="lookupMask"></div>
<div class="panel" id="lookupPanel">
  <div class="panelHandle"></div>
  <div class="panelHead">
    <div class="panelTitle">六十四卦 · 卦序</div>
    <button class="panelClose" id="lookupClose">✕</button>
  </div>
  <div class="panelBody">
    <div class="lookupIntro">《周易》通行本卦序 · 上经三十 · 下经三十四</div>
    <div class="lookupGrid" id="lookupGrid"></div>
  </div>
</div>

<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var cvWrap=document.getElementById('cvWrap');
var degEl=document.getElementById('deg'),dirEl=document.getElementById('dir'),
    elEl=document.getElementById('el');
var guaTag=document.getElementById('guaTag'),guaTagName=document.getElementById('guaTagName'),
    guaTagSub=document.getElementById('guaTagSub');
var btnStart=document.getElementById('btnStart'),btnLookup=document.getElementById('btnLookup');

var panelMask=document.getElementById('panelMask'),panel=document.getElementById('panel'),
    panelTitle=document.getElementById('panelTitle'),panelBody=document.getElementById('panelBody'),
    panelClose=document.getElementById('panelClose');

var lookupMask=document.getElementById('lookupMask'),lookupPanel=document.getElementById('lookupPanel'),
    lookupClose=document.getElementById('lookupClose'),lookupGrid=document.getElementById('lookupGrid');

var fHeading=0,active=false,listening=false,F=0.18;
var DPR=Math.min(window.devicePixelRatio||2,3);
var W=800,H=800,R=0;

var SHAN=['子','癸','丑','艮','寅','甲','卯','乙','辰','巽','巳','丙',
          '午','丁','未','坤','申','庚','酉','辛','戌','乾','亥','壬'];
var ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var SHENGXIAO=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

// 八纯卦完整资料
var BAGUA=[
  {s:'☵', name:'坎', angle:0, dir:'北',
   gua:'坎为水', symbol:'䷜', no:29,
   ciphr:'坎：习坎，有孚，维心亨，行有尚。',
   expl:[['习坎','重重险难'],['有孚','心怀诚信'],['维心亨','内心通达'],['行有尚','行动可嘉尚']],
   xiang:'水洊至，习坎；君子以常德行，习教事。',
   xiangBai:'水流叠至，险难重重；君子应恒守德行，反复修习教化之事。',
   tuan:'习坎，重险也。水流而不盈，行险而不失其信。维心亨，乃以刚中也。行有尚，往有功也。天险不可升也，地险山川丘陵也，王公设险以守其国，险之时用大矣哉！',
   yao:[['初六','习坎，入于坎窞，凶'],['九二','坎有险，求小得'],
        ['六三','来之坎坎，险且枕，入于坎窞，勿用'],
        ['六四','樽酒簋贰，用缶，纳约自牖，终无咎'],
        ['九五','坎不盈，祗既平，无咎'],
        ['上六','系用徽纆，寘于丛棘，三岁不得，凶']]},

  {s:'☶', name:'艮', angle:45, dir:'东北',
   gua:'艮为山', symbol:'䷳', no:52,
   ciphr:'艮：艮其背，不获其身；行其庭，不见其人，无咎。',
   expl:[['艮其背','止于所不见'],['不获其身','忘我'],['行其庭','行于庭中'],['不见其人','不见外物']],
   xiang:'兼山，艮；君子以思不出其位。',
   xiangBai:'两山重叠，止而又止；君子应思虑不超出自己的本分与位置。',
   tuan:'艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。',
   yao:[['初六','艮其趾，无咎，利永贞'],['六二','艮其腓，不拯其随，其心不快'],
        ['九三','艮其限，列其夤，厉薰心'],['六四','艮其身，无咎'],
        ['六五','艮其辅，言有序，悔亡'],['上九','敦艮，吉']]},

  {s:'☳', name:'震', angle:90, dir:'东',
   gua:'震为雷', symbol:'䷲', no:51,
   ciphr:'震：亨。震来虩虩，笑言哑哑；震惊百里，不丧匕鬯。',
   expl:[['亨','通达'],['虩虩','恐惧貌'],['哑哑','笑语声'],['匕鬯','祭器与香酒']],
   xiang:'洊雷，震；君子以恐惧修省。',
   xiangBai:'雷声接连而至，震动不息；君子应心怀敬畏，反省修身。',
   tuan:'震，亨。震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出可以守宗庙社稷，以为祭主也。',
   yao:[['初九','震来虩虩，后笑言哑哑，吉'],
        ['六二','震来厉，亿丧贝，跻于九陵，勿逐，七日得'],
        ['六三','震苏苏，震行无眚'],['九四','震遂泥'],
        ['六五','震往来厉，亿无丧，有事'],
        ['上六','震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言']]},

  {s:'☴', name:'巽', angle:135, dir:'东南',
   gua:'巽为风', symbol:'䷸', no:57,
   ciphr:'巽：小亨，利有攸往，利见大人。',
   expl:[['小亨','小有通达'],['利有攸往','宜有所往'],['利见大人','宜见大人']],
   xiang:'随风，巽；君子以申命行事。',
   xiangBai:'风随风而至，无所不入；君子应申明教令，推行政事。',
   tuan:'重巽以申命。刚巽乎中正而志行。柔皆顺乎刚，是以小亨，利有攸往，利见大人。',
   yao:[['初六','进退，利武人之贞'],['九二','巽在床下，用史巫纷若，吉无咎'],
        ['九三','频巽，吝'],['六四','悔亡，田获三品'],
        ['九五','贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉'],
        ['上九','巽在床下，丧其资斧，贞凶']]},

  {s:'☲', name:'离', angle:180, dir:'南',
   gua:'离为火', symbol:'䷝', no:30,
   ciphr:'离：利贞，亨。畜牝牛，吉。',
   expl:[['利贞','利于守正'],['亨','通达'],['畜牝牛','养母牛（喻柔顺）']],
   xiang:'明两作，离；大人以继明照于四方。',
   xiangBai:'光明相继升起，离卦之象；大人应持续以光明照临天下四方。',
   tuan:'离，丽也。日月丽乎天，百谷草木丽乎土，重明以丽乎正，乃化成天下。柔丽乎中正，故亨，是以畜牝牛吉也。',
   yao:[['初九','履错然，敬之无咎'],['六二','黄离，元吉'],
        ['九三','日昃之离，不鼓缶而歌，则大耋之嗟，凶'],
        ['九四','突如其来如，焚如，死如，弃如'],
        ['六五','出涕沱若，戚嗟若，吉'],
        ['上九','王用出征，有嘉折首，获匪其丑，无咎']]},

  {s:'☷', name:'坤', angle:225, dir:'西南',
   gua:'坤为地', symbol:'䷁', no:2,
   ciphr:'坤：元亨，利牝马之贞。君子有攸往，先迷后得主，利。',
   expl:[['元亨','大通'],['牝马之贞','母马般的柔顺守正'],['先迷后得','先迷失后得主'],['利','有利']],
   xiang:'地势坤，君子以厚德载物。',
   xiangBai:'大地的气势宽厚和顺；君子应增厚美德，容载万物。',
   tuan:'至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆。含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞。君子攸行，先迷失道，后顺得常。西南得朋，乃与类行；东北丧朋，乃终有庆。安贞之吉，应地无疆。',
   yao:[['初六','履霜，坚冰至'],['六二','直方大，不习无不利'],
        ['六三','含章可贞。或从王事，无成有终'],
        ['六四','括囊，无咎无誉'],['六五','黄裳，元吉'],
        ['上六','龙战于野，其血玄黄']]},

  {s:'☱', name:'兑', angle:270, dir:'西',
   gua:'兑为泽', symbol:'䷹', no:58,
   ciphr:'兑：亨，利贞。',
   expl:[['亨','通达'],['利贞','利于守正']],
   xiang:'丽泽，兑；君子以朋友讲习。',
   xiangBai:'两泽相连，相互滋润；君子应与朋友相互讲习，共同进步。',
   tuan:'兑，说也。刚中而柔外，说以利贞，是以顺乎天而应乎人。说以先民，民忘其劳；说以犯难，民忘其死；说之大，民劝矣哉！',
   yao:[['初九','和兑，吉'],['九二','孚兑，吉，悔亡'],
        ['六三','来兑，凶'],['九四','商兑未宁，介疾有喜'],
        ['九五','孚于剥，有厉'],['上六','引兑']]},

  {s:'☰', name:'乾', angle:315, dir:'西北',
   gua:'乾为天', symbol:'䷀', no:1,
   ciphr:'乾：元，亨，利，贞。',
   expl:[['元','元始、开端'],['亨','通达'],['利','和合相宜'],['贞','守正固持']],
   xiang:'天行健，君子以自强不息。',
   xiangBai:'天道运行刚健永不停息；君子应效法天道，奋发自立，永不止歇。',
   tuan:'大哉乾元，万物资始，乃统天。云行雨施，品物流形。大明终始，六位时成，时乘六龙以御天。乾道变化，各正性命，保合太和，乃利贞。首出庶物，万国咸宁。',
   yao:[['初九','潜龙勿用'],['九二','见龙在田，利见大人'],
        ['九三','君子终日乾乾，夕惕若厉，无咎'],
        ['九四','或跃在渊，无咎'],
        ['九五','飞龙在天，利见大人'],
        ['上九','亢龙有悔']]}
];

// 六十四卦速查表：卦符 + 卦名（按通行本卦序）
var GUA64_LIST = [
  ['䷀','乾为天'],['䷁','坤为地'],['䷂','水雷屯'],['䷃','山水蒙'],
  ['䷄','水天需'],['䷅','天水讼'],['䷆','地水师'],['䷇','水地比'],
  ['䷈','风天小畜'],['䷉','天泽履'],['䷊','地天泰'],['䷋','天地否'],
  ['䷌','天火同人'],['䷍','火天大有'],['䷎','地山谦'],['䷏','雷地豫'],
  ['䷐','泽雷随'],['䷑','山风蛊'],['䷒','地泽临'],['䷓','风地观'],
  ['䷔','火雷噬嗑'],['䷕','山火贲'],['䷖','山地剥'],['䷗','地雷复'],
  ['䷘','天雷无妄'],['䷙','山天大畜'],['䷚','山雷颐'],['䷛','泽风大过'],
  ['䷜','坎为水'],['䷝','离为火'],['䷞','泽山咸'],['䷟','雷风恒'],
  ['䷠','天山遁'],['䷡','雷天大壮'],['䷢','火地晋'],['䷣','地火明夷'],
  ['䷤','风火家人'],['䷥','火泽睽'],['䷦','水山蹇'],['䷧','雷水解'],
  ['䷨','山泽损'],['䷩','风雷益'],['䷪','泽天夬'],['䷫','天风姤'],
  ['䷬','泽地萃'],['䷭','地风升'],['䷮','泽水困'],['䷯','水风井'],
  ['䷰','泽火革'],['䷱','火风鼎'],['䷲','震为雷'],['䷳','艮为山'],
  ['䷴','风山渐'],['䷵','雷泽归妹'],['䷶','雷火丰'],['䷷','火山旅'],
  ['䷸','巽为风'],['䷹','兑为泽'],['䷺','风水涣'],['䷻','水泽节'],
  ['䷼','风泽中孚'],['䷽','雷山小过'],['䷾','水火既济'],['䷿','火水未济']
];

var GUA64_BY_PALACE = [
  ['䷜','䷻','䷂','䷃','䷄','䷅','䷆','䷇'],
  ['䷳','䷙','䷚','䷛','䷠','䷡','䷒','䷓'],
  ['䷲','䷔','䷕','䷖','䷗','䷘','䷚','䷛'],
  ['䷸','䷈','䷉','䷊','䷋','䷌','䷍','䷎'],
  ['䷝','䷰','䷱','䷶','䷷','䷵','䷞','䷟'],
  ['䷁','䷗','䷒','䷊','䷓','䷋','䷭','䷮'],
  ['䷹','䷪','䷫','䷬','䷭','䷮','䷯','䷰'],
  ['䷀','䷫','䷠','䷡','䷪','䷱','䷲','䷳']
];

var XING=['角','亢','氐','房','心','尾','箕','斗','牛','女','虚','危','室','壁',
          '奎','娄','胃','昴','毕','觜','参','井','鬼','柳','星','张','翼','轸'];

function getInfo(d){
  d=((d%360)+360)%360;
  var palaceIdx = Math.floor(((d+22.5)%360)/45);
  var palace = BAGUA[palaceIdx];
  var shanIdx = Math.floor(((d+7.5)%360)/15);
  var shan = SHAN[shanIdx];
  var sxIdx = Math.floor(((d+15)%360)/30);
  var sx = SHENGXIAO[sxIdx];
  var wuxingArr = [
    {wx:'水', sx:'玄武'},{wx:'土', sx:'螣蛇'},{wx:'木', sx:'青龙'},{wx:'木', sx:'青龙'},
    {wx:'土', sx:'勾陈'},{wx:'火', sx:'朱雀'},{wx:'火', sx:'朱雀'},{wx:'土', sx:'勾陈'},
    {wx:'金', sx:'白虎'},{wx:'金', sx:'白虎'},{wx:'土', sx:'螣蛇'},{wx:'水', sx:'玄武'}
  ];
  var w = wuxingArr[sxIdx];
  return {palace:palace, shan:shan, sx:sx, wx:w.wx, beast:w.sx, palaceIdx:palaceIdx};
}

function resizeCanvas(){
  var maxW = window.innerWidth - 2;
  var reservedH = 230;
  var maxH = window.innerHeight - reservedH;
  var size = Math.min(maxW, maxH);
  if(size < 200) size = 200;
  W = size; H = size;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cvWrap.style.width = W + 'px'; cvWrap.style.height = H + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(DPR,DPR);
  R = Math.min(W,H) * 0.47;
}

function ringText(cx,cy,r,texts,font,color,startAng,radial){
  ctx.save();ctx.translate(cx,cy);
  ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=color;
  var n=texts.length,step=360/n;
  for(var i=0;i<n;i++){
    var a=((startAng+i*step)*Math.PI)/180;
    ctx.save();ctx.rotate(a);
    if(radial)ctx.rotate(Math.PI/2);
    ctx.translate(0,-r);
    ctx.fillText(texts[i],0,0);
    ctx.restore();
  }
  ctx.restore();
}

function drawGua64(cx,cy,r,font,color){
  ctx.save();ctx.translate(cx,cy);
  ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=color;
  for(var p=0;p<8;p++){
    var startAngle = BAGUA[p].angle - 22.5;
    var step = 45 / 8;
    for(var k=0;k<8;k++){
      var a = (startAngle + step*k + step/2) * Math.PI / 180;
      ctx.save();ctx.rotate(a);
      ctx.translate(0,-r);
      ctx.fillText(GUA64_BY_PALACE[p][k],0,0);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawBagua(cx,cy,r,font,color){
  ctx.save();ctx.translate(cx,cy);
  ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=color;
  for(var i=0;i<BAGUA.length;i++){
    var a = BAGUA[i].angle * Math.PI / 180;
    ctx.save();ctx.rotate(a);
    ctx.translate(0,-r);
    ctx.fillText(BAGUA[i].s,0,0);
    ctx.restore();
  }
  ctx.restore();
}

function drawTaiji(cx,cy,r){
  ctx.save();ctx.translate(cx,cy);
  ctx.beginPath();ctx.arc(0,0,r,-Math.PI/2,Math.PI/2);ctx.fillStyle='#f5ecd8';ctx.fill();
  ctx.beginPath();ctx.arc(0,0,r,Math.PI/2,-Math.PI/2);ctx.fillStyle='#1a1a1a';ctx.fill();
  ctx.beginPath();ctx.arc(0,-r/2,r/2,0,Math.PI*2);ctx.fillStyle='#1a1a1a';ctx.fill();
  ctx.beginPath();ctx.arc(0,r/2,r/2,0,Math.PI*2);ctx.fillStyle='#f5ecd8';ctx.fill();
  ctx.beginPath();ctx.arc(0,-r/2,r/6,0,Math.PI*2);ctx.fillStyle='#f5ecd8';ctx.fill();
  ctx.beginPath();ctx.arc(0,r/2,r/6,0,Math.PI*2);ctx.fillStyle='#1a1a1a';ctx.fill();
  ctx.restore();
}

function draw(h){
  var cx=W/2, cy=H/2;
  ctx.clearRect(0,0,W,H);
  ctx.beginPath();ctx.arc(cx,cy,R*1.02,0,Math.PI*2);ctx.fillStyle='#1a150a';ctx.fill();
  var bg=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R*1.02);
  bg.addColorStop(0,'#fdf3d8');bg.addColorStop(.7,'#eeda9e');bg.addColorStop(1,'#c9a86a');
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
  ctx.strokeStyle='#8b6f3a';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R*.98,0,Math.PI*2);ctx.strokeStyle='#8b1a1a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R*.95,0,Math.PI*2);ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;ctx.stroke();
  drawGua64(cx,cy,R*.92,R*.028+'px sans-serif','#3a2a10');
  ringText(cx,cy,R*.86,XING,R*.030+'px "PingFang SC","Microsoft YaHei",sans-serif','#4a3520',0,false);
  ringText(cx,cy,R*.80,SHAN,'bold '+R*.046+'px "PingFang SC","Microsoft YaHei",sans-serif','#8b1a1a',0,false);
  ringText(cx,cy,R*.735,SHENGXIAO,'bold '+R*.050+'px "PingFang SC","Microsoft YaHei",sans-serif','#8b1a1a',0,false);
  ringText(cx,cy,R*.675,GAN.concat(ZHI),R*.036+'px "PingFang SC","Microsoft YaHei",sans-serif','#1a1a1a',0,false);
  drawBagua(cx,cy,R*.605,R*.080+'px "Segoe UI Symbol",sans-serif','#8b1a1a');
  ctx.save();ctx.translate(cx,cy);
  for(var i=0;i<360;i+=5){
    var rad=i*Math.PI/180;
    var isMajor=i%30===0, isCard=i%90===0;
    var outR=R*.56, inR=isMajor?(isCard?R*.49:R*.51):R*.53;
    ctx.beginPath();
    ctx.moveTo(Math.sin(rad)*outR,-Math.cos(rad)*outR);
    ctx.lineTo(Math.sin(rad)*inR,-Math.cos(rad)*inR);
    ctx.strokeStyle=isCard?'#8b1a1a':(isMajor?'#1a1a1a':'#5a4a30');
    ctx.lineWidth=isCard?2.5:(isMajor?1.8:1);
    ctx.stroke();
  }
  ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,R*.44,0,Math.PI*2);ctx.fillStyle='#fbf3e0';ctx.fill();
  ctx.strokeStyle='#8b6f3a';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R*.42,0,Math.PI*2);ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;ctx.stroke();
  ringText(cx,cy,R*.375,ZHI,'bold '+R*.056+'px "PingFang SC","Microsoft YaHei",sans-serif','#8b1a1a',0,false);
  drawTaiji(cx,cy,R*.26);
  ctx.save();ctx.translate(cx,cy);
  ctx.beginPath();ctx.moveTo(-R*.26,0);ctx.lineTo(R*.26,0);
  ctx.moveTo(0,-R*.26);ctx.lineTo(0,R*.26);
  ctx.strokeStyle='#8b1a1a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.restore();
  ctx.save();ctx.translate(cx,cy);ctx.rotate((-h*Math.PI)/180);
  var pl=R*.34,pw=R*.030;
  ctx.beginPath();ctx.moveTo(0,-pl);ctx.lineTo(pw*3,0);ctx.lineTo(0,pw);ctx.lineTo(-pw*3,0);ctx.closePath();
  ctx.fillStyle='#c81e1e';ctx.shadowColor='#ff000080';ctx.shadowBlur=10;ctx.fill();
  ctx.beginPath();ctx.moveTo(0,pl);ctx.lineTo(pw*3,0);ctx.lineTo(0,-pw);ctx.lineTo(-pw*3,0);ctx.closePath();
  ctx.fillStyle='#f5f5f5';ctx.shadowColor='#ffffff60';ctx.shadowBlur=8;ctx.fill();
  ctx.beginPath();ctx.arc(0,0,R*.022,0,Math.PI*2);ctx.fillStyle='#c9a86a';ctx.shadowBlur=8;ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.restore();
  ctx.save();ctx.translate(cx,cy);
  ctx.beginPath();
  ctx.moveTo(-R*.98,0);ctx.lineTo(-R*.52,0);
  ctx.moveTo(R*.52,0);ctx.lineTo(R*.98,0);
  ctx.moveTo(0,-R*.98);ctx.lineTo(0,-R*.52);
  ctx.moveTo(0,R*.52);ctx.lineTo(0,R*.98);
  ctx.strokeStyle='#8b1a1a70';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
}

var lastPalaceIdx = -1;

function renderTag(palaceIdx){
  var p = BAGUA[palaceIdx];
  guaTagName.textContent = p.gua;
  var firstPhrase = p.xiang.split(/[，。；]/)[0];
  guaTagSub.textContent = '· ' + firstPhrase;
}

function renderPanel(palaceIdx){
  var p = BAGUA[palaceIdx];
  panelTitle.textContent = p.gua;
  var html = '';
  html += '<div class="guaHeader">';
  html += '<div class="guaHeaderName">' + p.gua + '<span class="guaHeaderSymbol">' + p.symbol + '</span></div>';
  html += '<div class="guaHeaderMeta">《周易》第' + p.no + '卦 · ' + p.dir + '</div>';
  html += '</div>';
  html += '<div class="section"><div class="sectionTitle">象 传</div>';
  html += '<div class="xiang">' + p.xiang + '</div>';
  html += '<div class="xiangBai">' + p.xiangBai + '</div></div>';
  html += '<div class="section"><div class="sectionTitle">彖 传</div>';
  html += '<div class="tuan">' + p.tuan + '</div></div>';
  html += '<div class="section"><div class="sectionTitle">卦 辞</div>';
  html += '<div class="ciphr">' + p.ciphr + '</div>';
  html += '<div class="expl">';
  for(var i=0;i<p.expl.length;i++){
    html += '<div class="explRow"><span class="explNo">' + p.expl[i][0] + '</span>' +
            '<span class="explText">' + p.expl[i][1] + '</span></div>';
  }
  html += '</div></div>';
  html += '<div class="section"><div class="sectionTitle">六 爻（由下往上）</div>';
  for(var j=0;j<p.yao.length;j++){
    html += '<div class="yaoRow"><span class="yaoNo">' + p.yao[j][0] + '</span>' +
            '<span class="yaoText">' + p.yao[j][1] + '</span></div>';
  }
  html += '</div>';
  html += '<div class="tip">— 点击空白处或 ✕ 收起 —</div>';
  panelBody.innerHTML = html;
}

function openPanel(){panel.classList.add('show');panelMask.classList.add('show');}
function closePanel(){panel.classList.remove('show');panelMask.classList.remove('show');}
function openLookup(){lookupPanel.classList.add('show');lookupMask.classList.add('show');}
function closeLookup(){lookupPanel.classList.remove('show');lookupMask.classList.remove('show');}

// 渲染 64 卦速查表
function renderLookup(){
  var html = '';
  for(var i=0;i<GUA64_LIST.length;i++){
    html += '<div class="lookupItem">';
    html += '<div class="sym">' + GUA64_LIST[i][0] + '</div>';
    html += '<div class="nm">' + GUA64_LIST[i][1] + '</div>';
    html += '<div class="no">第' + (i+1) + '卦</div>';
    html += '</div>';
  }
  lookupGrid.innerHTML = html;
}

function update(d){
  var n=((d%360)+360)%360;
  var info = getInfo(n);
  degEl.textContent = Math.round(n)+'°';
  dirEl.textContent = info.palace.name + ' · ' + info.palace.dir;
  elEl.textContent  = info.shan + '山 · ' + info.sx + ' · ' + info.wx + '（' + info.beast + '）';
  if(info.palaceIdx !== lastPalaceIdx){
    lastPalaceIdx = info.palaceIdx;
    renderTag(info.palaceIdx);
    renderPanel(info.palaceIdx);
  }
  draw(n);
}

guaTag.addEventListener('click', function(){
  if(panel.classList.contains('show')) closePanel();
  else openPanel();
});
panelMask.addEventListener('click', closePanel);
panelClose.addEventListener('click', closePanel);

btnLookup.addEventListener('click', openLookup);
lookupMask.addEventListener('click', closeLookup);
lookupClose.addEventListener('click', closeLookup);

function onOri(e){
  var hh=null;
  if(e.webkitCompassHeading!==undefined&&e.webkitCompassHeading!==null){hh=e.webkitCompassHeading;}
  else if(e.alpha!==undefined&&e.alpha!==null){hh=(360-e.alpha)%360;}
  if(hh===null||isNaN(hh)){return;}
  if(!active){fHeading=hh;active=true;}
  else{var diff=hh-fHeading;if(diff>180)diff-=360;if(diff<-180)diff+=360;fHeading=(fHeading+F*diff+360)%360;}
  update(fHeading);
}

function start(){
  if(listening)return;
  if(window.DeviceOrientationEvent){
    window.addEventListener('deviceorientation',onOri,true);
    listening=true;btnStart.classList.add('hd');
  }else{
    btnStart.textContent='不支持传感器';
    btnStart.disabled=true;btnStart.style.opacity='.6';
    update(0);return;
  }
}

function ask(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(s){
      if(s==='granted'){start();}
      else{btnStart.textContent='重新请求权限';}
    }).catch(function(){});
  }else{start();}
}

function init(){
  resizeCanvas();
  update(0);
  renderLookup();
  if(!window.DeviceOrientationEvent){
    btnStart.textContent='不支持传感器';
    btnStart.disabled=true;btnStart.style.opacity='.6';
  }else{btnStart.addEventListener('click',ask);}
  window.addEventListener('resize',function(){resizeCanvas();update(fHeading);});
  window.addEventListener('orientationchange',function(){setTimeout(function(){resizeCanvas();update(fHeading);},300);});
}
window.addEventListener('load',init);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&listening)update(fHeading);});
})();
</script>
